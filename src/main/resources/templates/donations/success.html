<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Don réussi !</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f0f4f8; font-family:'Segoe UI',sans-serif;
               display:flex; align-items:center; justify-content:center;
               min-height:100vh; }
        .card { border:none; border-radius:20px; padding:3rem 2.5rem;
                text-align:center; max-width:460px; width:100%;
                box-shadow:0 8px 40px rgba(0,0,0,0.1); }
        .circle { width:90px; height:90px; background:#d8f3dc;
                  border-radius:50%; display:flex; align-items:center;
                  justify-content:center; font-size:2.5rem;
                  margin:0 auto 1.5rem; }
        .btn-home { background:#2d6a4f; color:white; border:none;
                    border-radius:10px; padding:0.8rem 2rem;
                    font-weight:700; text-decoration:none;
                    display:inline-block; margin-top:1.5rem; }
        .btn-home:hover { background:#1b4332; color:white; }
    </style>
</head>
<body>
<div class="card">
    <div class="circle">🎉</div>
    <h3 style="font-weight:800;color:#1a1a2e;margin-bottom:0.5rem;">
        Don effectué avec succès !
    </h3>
    <p style="color:#888;line-height:1.7;">
        Merci pour votre générosité !<br>
        Votre don contribue à financer des actions qui changent des vies.
    </p>
    <div style="background:#f0faf4;border-radius:10px;
                padding:0.8rem 1.2rem;margin-top:1rem;
                font-size:0.85rem;color:#2d6a4f;">
        <i class="bi bi-check-circle-fill me-2"></i>
        Paiement confirmé via <strong>Stripe</strong>
    </div>
    <a href="/" class="btn-home">
        <i class="bi bi-house me-2"></i>Retour à l'accueil
    </a>
</div>
</body>
</html>
