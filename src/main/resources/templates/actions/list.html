<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes actions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1b4332; }
        .card { border: none; border-radius: 14px;
                box-shadow: 0 2px 15px rgba(0,0,0,0.06); }
        .status-badge {
            padding: 0.25rem 0.7rem; border-radius: 50px;
            font-size: 0.75rem; font-weight: 700;
        }
        .status-DRAFT     { background:#e2e3e5; color:#41464b; }
        .status-ACTIVE    { background:#d1e7dd; color:#0f5132; }
        .status-COMPLETED { background:#cfe2ff; color:#084298; }
        .status-ARCHIVED  { background:#fff3cd; color:#856404; }
        .status-CANCELLED { background:#f8d7da; color:#842029; }
        .action-img {
            width:100%; 
            height:160px;
            object-fit:cover; 
            border-radius:10px;
        }
        .action-img-placeholder {
            width:100%; height:160px;
            background:linear-gradient(135deg,#1b4332,#2d6a4f);
            border-radius:10px; display:flex;
            align-items:center; justify-content:center;
            font-size:3rem;
        }
        .progress-bar-custom {
            height:6px; border-radius:3px;
            background:linear-gradient(90deg,#2d6a4f,#52b788);
        }
        .progress-track {
            height:6px; background:#e8f5e9;
            border-radius:3px; overflow:hidden;
        }
        .btn-green {
            background:#2d6a4f; color:white; border:none;
            border-radius:8px; padding:0.45rem 1rem;
            font-size:0.85rem; font-weight:600;
            text-decoration:none; transition:all 0.2s;
        }
        .btn-green:hover { background:#1b4332; color:white; }
        .category-badge {
            background:#d8f3dc; color:#2d6a4f;
            padding:0.2rem 0.7rem; border-radius:50px;
            font-size:0.75rem; font-weight:600;
        }
    </style>
</head>
<body>



<nav class="navbar navbar-dark px-4 py-3 d-flex justify-content-between">
    <a class="navbar-brand fw-bold" href="/">🤝 CharityApp</a>
    <div class="d-flex gap-2">
        <a href="/dashboard" class="btn btn-outline-light btn-sm">
            <i class="bi bi-grid me-1"></i>Dashboard
        </a>
        <a href="/actions/create" class="btn btn-light btn-sm fw-semibold">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle action
        </a>
    </div>
</nav>

<div class="container py-5">

    <!-- Alerts -->
    <div th:if="${param.created}"  class="alert alert-success">✅ Action créée avec succès !</div>
    <div th:if="${param.updated}"  class="alert alert-success">✅ Action mise à jour !</div>
    <div th:if="${param.published}" class="alert alert-success">🚀 Action publiée !</div>
    <div th:if="${param.archived}" class="alert alert-warning">📦 Action archivée.</div>
    <div th:if="${param.deleted}"  class="alert alert-danger">🗑️ Action supprimée.</div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Mes actions de charité</h2>
            <p class="text-muted mb-0"
               th:text="${organisation.name}"></p>
        </div>
        <a href="/actions/create" class="btn-green">
            <i class="bi bi-plus-circle me-1"></i>Créer une action
        </a>
    </div>

    <!-- Aucune action -->
    <div th:if="${actions.empty}" class="text-center py-5">
        <div class="card p-5">
            <div style="font-size:4rem;">💚</div>
            <h4 class="mt-3 fw-bold">Aucune action pour l'instant</h4>
            <p class="text-muted">Créez votre première action de charité !</p>
            <a href="/actions/create" class="btn-green d-inline-block mt-2">
                <i class="bi bi-plus-circle me-1"></i>Créer une action
            </a>
        </div>
    </div>

    <!-- Liste des actions -->
    <div th:if="${!actions.empty}" class="row g-4">
        <div class="col-md-4" th:each="action : ${actions}">
            <div class="card h-100">

                <!-- Image -->
                <div style="padding:3rem 1rem 0;margin:auto;">
                    <img th:if="${action.featuredImage != null}"
                         th:src="@{'/uploads/' + ${action.featuredImage}}"
                         class="action-img " alt="Image"/>
                    <div th:if="${action.featuredImage == null}"
                         class="action-img-placeholder">💚
                    </div>
                </div>

            
                <div class="card-body p-3">

                    <!-- Catégorie + Statut -->
                    <div class="d-flex justify-content-between mb-2">
                        <span class="category-badge"
                              th:text="${action.category}"></span>
                        <span class="status-badge"
                              th:classappend="'status-' + ${action.status}"
                              th:text="${action.status}"></span>
                    </div>

                    <!-- Titre -->
                    <h5 class="fw-bold mb-1"
                        style="font-size:0.98rem;"
                        th:text="${action.title}"></h5>

                    <!-- Description courte -->
                    <p class="text-muted mb-2"
                       style="font-size:0.84rem; line-height:1.5;"
                       th:text="${action.shortDescription}"></p>

                    <!-- Progression -->
                    <div th:if="${action.targetAmount != null}" class="mb-3">
                        <div class="d-flex justify-content-between mb-1"
                             style="font-size:0.78rem;">
                            <span class="text-success fw-semibold"
                                  th:text="${action.currentAmount + ' ' + action.currency}">
                            </span>
                            <span class="text-muted"
                                  th:text="'/ ' + ${action.targetAmount} + ' ' + ${action.currency}">
                            </span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-bar-custom"
                                 th:style="'width:' + ${action.progressPercentage} + '%'">
                            </div>
                        </div>
                    </div>

                    <!-- Infos -->
                    <div class="d-flex gap-3 mb-3"
                         style="font-size:0.78rem; color:#888;">
                        <span th:if="${action.location}">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${action.location}"></span>
                        </span>
                        <span>
                            <i class="bi bi-eye"></i>
                            <span th:text="${action.viewCount}"></span>
                        </span>
                    </div>

                    <!-- Boutons -->
                    <div class="d-flex gap-1 flex-wrap">
                        <a th:href="@{/actions/{id}(id=${action.id})}"
                           class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/actions/edit/{id}(id=${action.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <!-- Publier si DRAFT -->
                        <form th:if="${action.status.name() == 'DRAFT'}"
                              th:action="@{/actions/publish/{id}(id=${action.id})}"
                              method="post" class="d-inline">
                            <button class="btn btn-success btn-sm">
                                <i class="bi bi-send"></i> Publier
                            </button>
                        </form>

                        <!-- Archiver si ACTIVE -->
                        <form th:if="${action.status.name() == 'ACTIVE'}"
                              th:action="@{/actions/archive/{id}(id=${action.id})}"
                              method="post" class="d-inline">
                            <button class="btn btn-warning btn-sm">
                                <i class="bi bi-archive"></i>
                            </button>
                        </form>
                        <!-- ✅ Désarchiver si ARCHIVED -->
<form th:if="${action.status.name() == 'ARCHIVED'}"
      th:action="@{/actions/unarchive/{id}(id=${action.id})}"
      method="post" class="d-inline">
    <button class="btn-action btn-unarchive"
            title="Désarchiver">
        <i class="bi bi-arrow-counterclockwise"></i>
        
    </button>
</form>

                        <!-- Supprimer -->
                        <form th:action="@{/actions/delete/{id}(id=${action.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer cette action ?')">
                            <button class="btn btn-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
